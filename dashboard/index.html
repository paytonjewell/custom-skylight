<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#F1F1F1">
  <title>White Lotus HQ</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <!-- SVG favicon flips dark/light with the browser; PNG for browsers without SVG favicons -->
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script>
    // Apply the last theme before first paint (no flash); the app re-checks it (incl. Dark after sunset).
    // Storage can be unavailable — default to Pastel.
    try {
      const t = localStorage.getItem('themeApplied');
      if (t) document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script>
    // Wall-display self-healing: if the app bundle failed to load (e.g. a stale page right after a
    // deploy, or a network blip), reload until it starts.
    setTimeout(() => {
      if (!document.getElementById('stage')) location.reload();
    }, 10000);
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
